name: Pane Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    if: ${{ github.repository == 'bhwa233/Pane' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Build Pane and native screenshot tool
        run: |
          ./src/Pane.App/scripts/build.ps1 -Mode aot -OutputRoot "$env:RUNNER_TEMP/pane"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = (Get-Item -LiteralPath "$env:RUNNER_TEMP/pane/aot/Pane.App.exe").VersionInfo.ProductVersion.Split('+')[0]
            if ($env:GITHUB_REF_NAME -cne "v$version") { throw "Tag must match the built version v$version." }
          }
          ./src/Pane.Capture/build.ps1 -OutputRoot "$env:RUNNER_TEMP/capture" -StageDirectory "$env:RUNNER_TEMP/pane/aot/NativeCapture"
          Copy-Item LICENSE,LICENSE-EXCEPTION.md,THIRD_PARTY_NOTICES.md,src/Pane.App/ThirdParty -Destination "$env:RUNNER_TEMP/pane/aot" -Recurse
          ./scripts/package-portable.ps1 -AppDirectory "$env:RUNNER_TEMP/pane/aot" -OutputDirectory "$env:RUNNER_TEMP/dist"
      - name: Verify bundled startup
        run: |
          $version = (Get-Item -LiteralPath "$env:RUNNER_TEMP/pane/aot/Pane.App.exe").VersionInfo.ProductVersion.Split('+')[0]
          $launcher = "$env:RUNNER_TEMP/dist/pane-$version.exe"
          $env:PANE_DATA_DIR = "$env:RUNNER_TEMP/pane-smoke"
          $verification = Start-Process -FilePath $launcher -ArgumentList '--verify-traffic-payload' -WindowStyle Hidden -Wait -PassThru
          if ($verification.ExitCode -ne 0) { throw "Embedded traffic payload verification failed: $($verification.ExitCode)" }
          $process = Start-Process -FilePath $launcher -ArgumentList '--exit' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Single-file startup failed: $($process.ExitCode)" }
          $bundles = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'Pane/bundles'
          $bundle = Get-ChildItem -LiteralPath $bundles -Directory | Where-Object {
            Test-Path -LiteralPath (Join-Path $_.FullName 'NativeCapture/ScreenCapture.exe') -PathType Leaf
          } | Select-Object -First 1
          if (!$bundle) { throw 'The single-file launcher did not extract the native screenshot component.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Pane-Windows-x64-${{ github.run_number }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
  publish-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Pane-Windows-x64-${{ github.run_number }}
          path: dist
      - name: Publish the Windows executable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          (cd dist && sha256sum --check SHA256SUMS.txt)
          printf '下载 `pane-%s.exe` 后双击启动。支持 Windows x64，首次运行会自动解包。`pane.exe` 为旧版在线更新兼容附件，内容相同。\n\n' "$version" > "$RUNNER_TEMP/release-notes.md"
          cat dist/release-notes.md >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" --verify-tag --title "Pane $version" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "dist/pane-$version.exe" dist/pane.exe dist/SHA256SUMS.txt
